<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Tekzo IT Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">

  <div class="login-bg-glow glow-1"></div>
  <div class="login-bg-glow glow-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <span>TEKZO</span>
          <span class="badge">ADMIN</span>
        </div>
        <h2>Welcome Back</h2>
        <p>Enter your agency credentials to access the control dashboard</p>
      </div>

      <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-user icon"></i>
            <input type="text" id="username" name="username" placeholder="e.g. admin" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pass" onclick="togglePassword()"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-actions">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember session</span>
          </label>
          <a href="#" onclick="alert('Demo Admin Credentials:\nUsername: admin\nPassword: tekzo@2026'); return false;" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-admin-primary">
          <span>Sign In to Dashboard</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer">
        <p>Protected Agency Portal • <a href="index.html">Return to Public Site</a></p>
        <div class="demo-hint">
          <span>💡 Default Login: <strong>admin</strong> / <strong>tekzo@2026</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
